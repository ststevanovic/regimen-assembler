<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="100%" style="stop-color:#1b2838"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="98" fill="url(#bg)" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Medical cross -->
  <rect x="85" y="52" width="30" height="76" rx="5" ry="5" fill="#c0392b"/>
  <rect x="62" y="75" width="76" height="30" rx="5" ry="5" fill="#c0392b"/>

  <!-- Pipeline flow nodes beneath cross -->
  <circle cx="52"  cy="148" r="8" fill="none" stroke="#5dade2" stroke-width="2.5"/>
  <circle cx="100" cy="148" r="8" fill="none" stroke="#5dade2" stroke-width="2.5"/>
  <circle cx="148" cy="148" r="8" fill="none" stroke="#5dade2" stroke-width="2.5"/>

  <!-- Connectors with arrowheads -->
  <line x1="60" y1="148" x2="88" y2="148" stroke="#5dade2" stroke-width="2" stroke-linecap="round"/>
  <polygon points="88,144 96,148 88,152" fill="#5dade2"/>
  <line x1="108" y1="148" x2="136" y2="148" stroke="#5dade2" stroke-width="2" stroke-linecap="round"/>
  <polygon points="136,144 144,148 136,152" fill="#5dade2"/>

  <!-- Dashed link from cross base to pipeline -->
  <line x1="100" y1="128" x2="100" y2="140" stroke="#5dade2" stroke-width="1.5" stroke-dasharray="3,2" stroke-linecap="round"/>

  <!-- Label -->
  <text x="100" y="185" text-anchor="middle"
        font-family="monospace" font-size="10" font-weight="bold"
        letter-spacing="2.5" fill="#5dade2">ASSEMBLER</text>
</svg>
